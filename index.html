<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Demo CRM za upise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
/* Plan: školski plavi/žuti identitet. Jedna svetla tema (namerno), tamnoplavi bočni meni,
   svetli tirkizni akcenat za pozadine, žuta samo za primarne radnje i oznake faza.
   Raspored: bočna navigacija + radna površina; sažetak pre detalja; Fraunces za naslove i velike brojeve, Figtree za tekst. */
:root{
  --navy:#0f2d57; --navy-2:#1b4580; --sun:#ffb81c; --sun-soft:#fff3d1; --mist:#e2f3f4; --paper:#f3f8f9;
  --card:#ffffff; --ink:#14263d; --muted:#5a6a7d; --line:#d8e3e7; --line-2:#e8eff1;
  --good:#0ca30c; --good-ink:#006300; --warn:#fab219; --crit:#d03b3b; --crit-ink:#a82a2a;
  --c1:#2a78d6; --c2:#1c5cab; --c3:#184f95;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px;border-radius:4px}
.side :focus-visible,.demobar :focus-visible{outline-color:var(--sun)}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
h1{font-family:var(--display);font-size:26px;line-height:1.15}
h2{font-size:15px}
h3{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* demo traka */
.demobar{position:sticky;top:0;z-index:30;background:var(--sun);color:#2a1d00;padding:6px 16px;font-size:12.5px;font-weight:600;display:flex;gap:10px;align-items:center;min-height:34px}
.demobar .tag{background:var(--navy);color:#fff;border-radius:4px;padding:1px 7px;font-size:11.5px;letter-spacing:.04em}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 34px)}
.side{background:var(--navy);color:#d9e5f3;padding:18px 12px;position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 10px}
.brand svg{flex:none}
.brand b{display:block;font-family:var(--display);font-size:18px;font-weight:600;color:#fff;line-height:1.1}
.brand span{font-size:12px;color:#9fb6d3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#d9e5f3;text-decoration:none;font-weight:500;position:relative}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:4px;border-radius:0 3px 3px 0;background:var(--sun)}
.nav svg{width:18px;height:18px;flex:none;opacity:.9}
.nav .badge{margin-left:auto;background:var(--sun);color:#2a1d00;border-radius:10px;padding:0 7px;font-size:11.5px;font-weight:700}
.nav .ph{margin-left:auto;border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:0 5px;font-size:10.5px;color:#cfe0f3;white-space:nowrap}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid rgba(255,255,255,.12)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--mist);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.me small{display:block;color:#9fb6d3}

.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:18px 28px 6px;flex-wrap:wrap}
.top .crumb{color:var(--muted);font-size:12.5px;margin-bottom:2px}
.lang{display:inline-flex;border:1.5px solid var(--navy);border-radius:999px;padding:2px;background:#fff}
.lang button{border:0;background:none;padding:4px 14px;border-radius:999px;font-weight:700;color:var(--navy);font-size:13px}
.lang button[aria-pressed="true"]{background:var(--navy);color:#fff}
#view{padding:12px 28px 40px;display:flex;flex-direction:column;gap:18px;outline:none}

/* kartice i osnovne komponente */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.card > header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.card .body{padding:14px 16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.stack{display:flex;flex-direction:column;gap:18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:8px;padding:5px 12px;font-weight:600;font-size:13px}
.btn:hover{background:var(--mist)}
.btn.primary{background:var(--sun);border-color:var(--sun);color:#2a1d00}
.btn.primary:hover{background:#ffc84d}
.btn.sm{padding:2px 9px;font-size:12.5px}
.btn.ghost{border-color:var(--line)}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:600;text-decoration:underline;text-underline-offset:2px;text-align:left}

/* KPI traka: jedna povezana celina */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kpis.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:14px 18px;border-right:1px solid var(--line-2);min-width:0}
.kpi:last-child{border-right:0}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:500}
.kpi .v{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;margin:4px 0 2px;color:var(--navy)}
.kpi .v small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--muted);margin-left:4px}
.kpi .h{font-size:12.5px;color:var(--muted)}
.kpi.alert .v{color:var(--crit-ink)}

/* pilule i oznake */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--mist);color:var(--navy)}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.st-new{background:#d7eef0;color:#0b4a52}
.st-contacted{background:#dbe8f8;color:#173f73}
.st-visit_scheduled{background:var(--sun-soft);color:#6b4600}
.st-visited{background:#c9dcf4;color:#123566}
.st-applied{background:#1b4580;color:#fff}
.st-enrolled{background:#d9f2d9;color:var(--good-ink)}
.st-lost{background:#e7ebee;color:#4a5866}
.chan{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink)}
.chan i{width:8px;height:8px;border-radius:2px;background:var(--navy-2);display:inline-block}
.over{color:var(--crit-ink);font-weight:700;display:inline-flex;gap:4px;align-items:center}
.phase{display:flex;gap:10px;align-items:flex-start;background:var(--sun-soft);border:1px solid #f1d58a;border-left:5px solid var(--sun);border-radius:8px;padding:10px 14px;color:#4a3300}
.phase b{white-space:nowrap}

/* tabele */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fbfdfd}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#f6fbfb}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.nw{white-space:nowrap}
.ell{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;min-height:32px}
.toolbar input{min-width:240px}

/* liste */
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.list li:last-child{border-bottom:0}
.list .t{min-width:0}
.list .t > *{display:block}
.list .t b,.list .t .link{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.list .t b{font-weight:700}

/* pregled */
.lead{margin:0;font-size:16px;max-width:70ch}
.row{display:flex;gap:12px;align-items:center;flex:none}
.list li.vis{justify-content:flex-start;gap:14px}
.date{width:46px;flex:none;border-radius:8px;background:var(--mist);color:var(--navy);display:flex;flex-direction:column;align-items:center;padding:4px 0;line-height:1.15}
.date b{font-family:var(--display);font-size:20px;font-weight:600}
.date small{font-size:11.5px}

.season{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.season > div{padding:14px 18px;border-right:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px;min-width:0}
.season > div:last-child{border-right:0}
.season .l{color:var(--muted);font-size:12.5px;font-weight:500}
.season .v{font-family:var(--display);font-size:32px;font-weight:600;line-height:1.1;color:var(--navy)}
.season .v small{font-family:var(--body);font-size:16px;color:var(--muted)}
.season .h{font-size:12.5px;color:var(--muted)}
.season{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.prog{height:10px;background:#edf3f5;border-radius:5px;overflow:hidden;display:flex;gap:2px}
.prog span{display:block;height:100%;background:var(--sun)}
.prog span.ap{background:#ffe08f}
.prog span.cur{background:#9fb6d3}
.legend i.cur{background:#9fb6d3}
.prog.sm{height:8px;flex:1}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--sun);margin-right:5px;vertical-align:-1px}
.legend i.ap{background:#ffe08f}
.season .grades{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:10px 28px;align-content:center}
.gr{display:flex;align-items:center;gap:10px;font-size:13px}
.gl{width:62px;flex:none}
.gv{width:52px;text-align:right;font-weight:600;flex:none;white-space:nowrap}
@media (max-width:820px){.season,.season .grades{grid-template-columns:1fr}.season > div{border-right:0;border-bottom:1px solid var(--line-2)}}

/* pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(158px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px;align-items:start}
.col{background:#edf4f5;border-radius:10px;padding:8px;min-height:140px;display:flex;flex-direction:column;gap:8px}
.col.over-drop{outline:2px dashed var(--navy);outline-offset:-2px}
.col h3{display:flex;justify-content:space-between;align-items:center;padding:4px 6px 6px;color:var(--navy)}
.col h3 span{color:var(--muted);font-size:12.5px;font-weight:600}
.col[data-stage="enrolled"] h3{color:var(--good-ink)}
.pcard .src{font-size:12px;color:var(--muted)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.pcard:hover{border-color:#9fb6d3}
.pcard:active{cursor:grabbing}
.pcard .n{font-weight:700;color:var(--navy);line-height:1.25}
.pcard .meta{display:flex;justify-content:space-between;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.pcard.dragging{opacity:.5}
.pcard .reason{font-size:12px;color:#4a5866}
.pcard.stage-enrolled{border-left:4px solid var(--good)}
.pcard.stage-lost{border-left:4px solid #9aa8b5}

/* profil */
.prhead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.parent{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.parent:last-child{border-bottom:0}
.parent .acts{display:flex;gap:6px}
.tl{list-style:none;margin:0;padding:6px 16px 12px;position:relative}
.tl li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;padding:8px 0;position:relative}
.tl li::before{content:"";position:absolute;left:6px;top:20px;bottom:-8px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .dot{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--navy-2);margin-top:3px;position:relative;z-index:1}
.note{background:var(--mist);border-radius:8px;padding:10px 12px;color:#0b4a52}
select.stagesel{border:1px solid var(--navy);border-radius:8px;padding:5px 8px;background:#fff;font-weight:600;color:var(--navy)}

/* grafici */
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 150px;gap:12px;align-items:center}
.bar .lab{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{height:14px;background:#edf3f5;border-radius:3px;position:relative}
.bar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:0 3px 3px 0;background:var(--c1);min-width:2px}
.bar:hover .fill,.bar:focus .fill{background:var(--c3)}
.bar .val{font-weight:700;min-width:70px;text-align:right}
.bar .val small{font-weight:500;color:var(--muted);margin-left:5px}
.cols{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px;border-bottom:1px solid var(--line)}
.colw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;min-width:0}
.colw .b{width:100%;max-width:34px;background:var(--c1);border-radius:3px 3px 0 0;min-height:2px}
.colw:hover .b,.colw:focus .b{background:var(--c3)}
.colw .cv{font-size:12px;font-weight:700}
.axis{display:flex;gap:6px;margin-top:6px;color:var(--muted);font-size:11.5px}
.axis span{flex:1;text-align:center;min-width:0;white-space:nowrap;overflow:visible}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--sun)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:5px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}

/* prekidač */
.sw{position:relative;width:38px;height:22px;border-radius:12px;background:#b9c6d0;border:0;flex:none;vertical-align:middle;margin-right:6px}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--navy-2)}
.sw[aria-checked="true"]::after{left:19px}

/* tooltip, toast, modal */
#tip{position:fixed;z-index:60;background:var(--navy);color:#fff;border-radius:8px;padding:7px 10px;font-size:12.5px;pointer-events:none;opacity:0;max-width:260px;box-shadow:0 6px 20px rgba(15,45,87,.25)}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;z-index:70;opacity:0;pointer-events:none;transition:opacity .15s}
#toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(15,45,87,.45);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:12px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px}
.modal .opts{display:flex;flex-direction:column;gap:6px}
.chk{width:18px;height:18px;accent-color:var(--navy)}
.done{text-decoration:line-through;color:var(--muted)}
.codebox{background:#0f2d57;color:#dbe8f8;border-radius:8px;padding:12px 14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;overflow-x:auto;white-space:pre}
.integ{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.integ div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.sr-only{position:absolute;left:-9999px}

@media (max-width: 1000px){
  .grid2,.grid3{grid-template-columns:1fr}
  .kpis,.kpis.k3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(2){border-right:0}
  .kpi:nth-child(-n+2){border-bottom:1px solid var(--line-2)}
}
@media (max-width: 820px){
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:column;padding:10px}
  .nav{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .nav a{white-space:nowrap}
  .nav a[aria-current="page"]::before{display:none}
  .me{display:none}
  .top,#view{padding-left:16px;padding-right:16px}
  .kv{grid-template-columns:1fr}
  .bar{grid-template-columns:90px minmax(0,1fr) 112px}
  .bar .val small{display:block;margin:0}
  .toolbar input{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){
  .sw::after,#toast{transition:none}
}
</style>
</head>
<body>
<div class="demobar" role="note"><span class="tag">DEMO</span><span id="demotext"></span></div>
<div class="shell">
  <aside class="side" id="side" aria-label="Navigacija"></aside>
  <div class="main">
    <header class="top" id="top"></header>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
'use strict';

/* ---------- Jezik ---------- */
const L = {
sr:{
 htmlLang:'sr', locale:'sr-Latn-RS',

 brandSub:'Upisi', role:'Osoblje za upise', navLabel:'Navigacija', langLabel:'Jezik',
 phase:{1:'Faza 1',2:'Faza 2',3:'Faza 3'},
 phase2:'Pregled funkcije iz Faze 2. Nije deo prve verzije.',
 phase3:'Pregled funkcije iz Faze 3. Nije deo prve verzije.',
 nav:{overview:'Pregled',inquiries:'Upiti',students:'Učenici',pipeline:'Pipeline upisa',events:'Posete i događaji',campaigns:'Kampanje',comms:'Komunikacija',analytics:'Analitika',tasks:'Zadaci',settings:'Podešavanja'},
 stage:{new:'Novi upit',contacted:'Kontaktiran',visit_scheduled:'Zakazana poseta',visited:'Posetio školu',applied:'Prijava',enrolled:'Upisan',lost:'Izgubljen'},
 chan:{google_ads:'Google oglasi',meta:'Meta oglasi',linkedin:'LinkedIn',seo:'Google pretraga (SEO)',chatbot:'Chatbot',leadmagnet:'Lead magnet (email)'},
 reason:{price:'Cena',location:'Lokacija',other_school:'Izabrao/la drugu školu',no_reply:'Nije odgovorio/la',other:'Drugo'},
 rel:{mother:'Majka',father:'Otac',guardian:'Staratelj'},

function timeline(s){

  ev.push({t:created + 60000, text:e.auto});
  if (s.stage !== 'new') ev.push({t:created + s.respH*H, text:fmt(e.call,{n:s.owner})});
  if (s.visitAt) ev.push({t:created + (s.respH+30)*H, text:fmt(e.booked,{d:dfmt(s.visitAt,{weekday:'short',day:'numeric',month:'short'})+', '+tfmt(s.visitAt)})});
  if (s.visitedAt) { ev.push({t:s.visitedAt, text:e.done}); ev.push({t:s.visitedAt + 18*H, text:e.follow}); }
  if (s.stage === 'applied' || s.stage === 'enrolled') ev.push({t:Math.min(NOW - 24*H, (s.visitedAt||created) + 6*24*H), text:e.applied});
  if (s.stage === 'enrolled') ev.push({t:Math.min(NOW - 12*H, (s.visitedAt||created) + 12*24*H), text:e.enrolled});
  if (s.stage === 'lost') ev.push({t:created + (s.createdH*.6)*H, text:fmt(e.lost,{r:T().reason[s.why]})});
  return ev.filter(x => x.t <= NOW + 10*24*H).sort((a,b) => b.t - a.t);

function askReason(id, done){

  m.querySelector('button').focus();

document.addEventListener('click', e => {
  const lb = e.target.closest('[data-lang]');
  if (lb) { lang = lb.dataset.lang; try { localStorage.setItem('crm-demo-lang', lang); } catch(x) {} render(true); return; }
  if (e.target.closest('[data-demo]')) { demoAct(); return; }
  if (e.target.closest('#lostbtn')) { showLost = !showLost; render(true); return; }
  const tab = e.target.closest('[data-tab]'); if (tab) { comTab = tab.dataset.tab; render(true); return; }
  const it = e.target.closest('[data-itab]'); if (it) { inqTab = it.dataset.itab; render(true); return; }
  const at = e.target.closest('[data-atab]'); if (at) { anTab = at.dataset.atab; render(true); return; }
  const md = e.target.closest('[data-model]'); if (md) { attrModel = md.dataset.model; render(true); return; }
  const sw = e.target.closest('[data-sw]');
  if (sw) { const i = +sw.dataset.sw; AUTOS[i].on = !AUTOS[i].on; sw.setAttribute('aria-checked', AUTOS[i].on); document.getElementById('swl'+i).textContent = AUTOS[i].on ? T().com.active : T().com.paused; return; }
  const go = e.target.closest('[data-go]');
  if (go && !e.target.closest('select,input')) { location.hash = '#' + go.dataset.go; return; }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('pcard')) { e.preventDefault(); location.hash = '#ucenik-' + e.target.dataset.id; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'stsel') { const id = route().slice(7); if (el.value === 'lost') askReason(id, why => { setStage(id, 'lost', why); render(true); }); else { setStage(id, el.value); render(true); } }
  else if (el.id === 'fs') { flt.stage = el.value; fillStudents(); }
  else if (el.id === 'psrc') { pf.src = el.value; fillBoard(); }
  else if (el.id === 'pown') { pf.own = el.value; fillBoard(); }
  else if (el.dataset && el.dataset.task) { if (el.checked) doneTasks.add(el.dataset.task); else doneTasks.delete(el.dataset.task); el.closest('li').querySelector('label').classList.toggle('done', el.checked); }
});
document.addEventListener('input', e => { if (e.target.id === 'fq') { flt.q = e.target.value; fillStudents(); } });

/* prevlačenje kartica */
let dragId = null;
document.addEventListener('dragstart', e => { const c = e.target.closest && e.target.closest('.pcard'); if (!c) return; dragId = c.dataset.id; c.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragId); e.dataTransfer.effectAllowed = 'move'; } catch(x) {} });
document.addEventListener('dragend', e => { const c = e.target.closest && e.target.closest('.pcard'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col.over-drop').forEach(x => x.classList.remove('over-drop')); });
document.addEventListener('dragover', e => { const col = e.target.closest && e.target.closest('.col'); if (col && dragId) { e.preventDefault(); document.querySelectorAll('.col.over-drop').forEach(x => x !== col && x.classList.remove('over-drop')); col.classList.add('over-drop'); } });
document.addEventListener('drop', e => {
  const col = e.target.closest && e.target.closest('.col'); if (!col || !dragId) return; e.preventDefault();
  const id = dragId, st = col.dataset.stage; dragId = null;
  const s = STUDENTS.find(x => x.id === id); if (!s || s.stage === st) { fillBoard(); return; }
  if (st === 'lost') askReason(id, why => { setStage(id, 'lost', why); fillBoard(); }); else { setStage(id, st); fillBoard(); }
});

/* tooltip */
const tip = document.getElementById('tip');
function showTip(el, x, y){ tip.textContent = el.getAttribute('data-tip'); tip.classList.add('on'); const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, x + 12) + 'px'; tip.style.top = (y + 14) + 'px'; }
document.addEventListener('mousemove', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('on'); });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) { const r = el.getBoundingClientRect(); showTip(el, r.left + 20, r.top - 36); } });
document.addEventListener('focusout', () => tip.classList.remove('on'));

window.addEventListener('hashchange', () => render(false));
render(true);
})();
</script>
</body>
</html>
